<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 920" role="img" aria-labelledby="title desc">
<title id="title">How daily report scope works</title><desc id="desc">The report combines all events in the selected day and timezone with older unresolved carry-over cases. Every included incident is listed. Older resolved and future events are excluded with a count. Administrative tasks are explicitly a current snapshot.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#69e0cb" stroke-width="1.6"/></marker></defs>
<rect width="840" height="920" rx="22" fill="#0b1425"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="65" fill="#69e0cb" font-size="27" font-weight="700" text-anchor="start">WHAT GOES INTO THE DAILY HANDOVER?</text><text x="40" y="109" fill="#f1f6ff" font-size="26" font-weight="700" text-anchor="start">First choose a day and a timezone, then save.</text><rect x="40" y="155" width="760" height="150" rx="18" fill="#14243b" stroke="#69e0cb" stroke-width="2"/><text x="64" y="199" fill="#69e0cb" font-size="25" font-weight="700" text-anchor="start">INCLUDE: EVENTS FROM THAT DAY</text><text x="64" y="239" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">All observations whose event time falls within the</text><text x="64" y="272" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">selected reporting day.</text><rect x="40" y="335" width="760" height="150" rx="18" fill="#14243b" stroke="#69e0cb" stroke-width="2"/><text x="64" y="379" fill="#69e0cb" font-size="25" font-weight="700" text-anchor="start">ALSO INCLUDE: OLDER OPEN CASES</text><text x="64" y="419" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">Older cases that still need a decision or action.</text><text x="64" y="452" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">These are called carry-over cases.</text><text x="420" y="330" fill="#69e0cb" font-size="30" font-weight="700" text-anchor="middle">+</text><path d="M420 500 L420 535" fill="none" stroke="#69e0cb" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="550" width="760" height="135" rx="18" fill="#1c3348" stroke="#a5c9ff" stroke-width="2"/><text x="420" y="600" fill="#f1f6ff" font-size="32" font-weight="700" text-anchor="middle">COMPLETE HANDOVER</text><text x="420" y="646" fill="#bbcade" font-size="23" font-weight="400" text-anchor="middle">Every included case is listed. Nothing is cut off at eight.</text><rect x="40" y="725" width="760" height="170" rx="18" fill="#14243b" stroke="#ffd397" stroke-width="2"/><text x="64" y="770" fill="#ffd397" font-size="25" font-weight="700" text-anchor="start">LEFT OUT, WITH A COUNT SHOWN</text><text x="64" y="810" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">Older closed cases and future-dated events. The task</text><text x="64" y="842" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">list is a current snapshot, not a count of today&#x27;s</text><text x="64" y="874" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">work.</text></g></svg>