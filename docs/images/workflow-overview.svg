<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 940" role="img" aria-labelledby="title desc">
<title id="title">Six steps for a retail QA case</title><desc id="desc">Watch the event; record facts; check source records; decide and document the result; prepare the daily report; keep a copy. The image is a diagram, not a screenshot.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#69e0cb" stroke-width="1.6"/></marker></defs>
<rect width="840" height="940" rx="22" fill="#0b1425"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="65" fill="#69e0cb" font-size="27" font-weight="700" text-anchor="start">ONE CASE, FROM OBSERVATION TO HANDOVER</text><text x="40" y="108" fill="#f1f6ff" font-size="31" font-weight="700" text-anchor="start">Use these six steps in the demo.</text><rect x="40" y="145" width="360" height="210" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="62" y="185" fill="#69e0cb" font-size="23" font-weight="700" text-anchor="start">01</text><text x="62" y="230" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="start">WATCH</text><text x="62" y="267" fill="#a5c9ff" font-size="22" font-weight="600" text-anchor="start">Observation Desk</text><text x="62" y="302" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Step through the illustrated</text><text x="62" y="331" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">event.</text><rect x="430" y="145" width="360" height="210" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="452" y="185" fill="#69e0cb" font-size="23" font-weight="700" text-anchor="start">02</text><text x="452" y="230" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="start">RECORD</text><text x="452" y="267" fill="#a5c9ff" font-size="22" font-weight="600" text-anchor="start">Incident Register</text><text x="452" y="302" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Write facts, source, time</text><text x="452" y="331" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">and next action.</text><rect x="40" y="381" width="360" height="210" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="62" y="421" fill="#69e0cb" font-size="23" font-weight="700" text-anchor="start">03</text><text x="62" y="466" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="start">CHECK</text><text x="62" y="503" fill="#a5c9ff" font-size="22" font-weight="600" text-anchor="start">Evidence &amp; Cases</text><text x="62" y="538" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Compare the matching source</text><text x="62" y="567" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">records.</text><rect x="430" y="381" width="360" height="210" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="452" y="421" fill="#69e0cb" font-size="23" font-weight="700" text-anchor="start">04</text><text x="452" y="466" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="start">DECIDE</text><text x="452" y="503" fill="#a5c9ff" font-size="22" font-weight="600" text-anchor="start">Review / history</text><text x="452" y="538" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Record the finding and next</text><text x="452" y="567" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">step.</text><rect x="40" y="617" width="360" height="210" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="62" y="657" fill="#69e0cb" font-size="23" font-weight="700" text-anchor="start">05</text><text x="62" y="702" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="start">REPORT</text><text x="62" y="739" fill="#a5c9ff" font-size="22" font-weight="600" text-anchor="start">Daily Report</text><text x="62" y="774" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Save the reporting date and</text><text x="62" y="803" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">your name.</text><rect x="430" y="617" width="360" height="210" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="452" y="657" fill="#69e0cb" font-size="23" font-weight="700" text-anchor="start">06</text><text x="452" y="702" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="start">KEEP A COPY</text><text x="452" y="739" fill="#a5c9ff" font-size="22" font-weight="600" text-anchor="start">Download / export</text><text x="452" y="774" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Save the handover and a JSON</text><text x="452" y="803" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">backup.</text><text x="40" y="903" fill="#bbcade" font-size="21" font-weight="400" text-anchor="start">Illustrated training workflow · All data is fictional</text></g></svg>