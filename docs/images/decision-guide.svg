<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 990" role="img" aria-labelledby="title desc">
<title id="title">Three alternative review outcomes</title><desc id="desc">If records match and approval is established, document the comparison and close. If records are missing, request them and retain uncertainty. If details differ, record the mismatch and request clarification. These are alternative outcomes, not sequential stages.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#69e0cb" stroke-width="1.6"/></marker></defs>
<rect width="840" height="990" rx="22" fill="#0b1425"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="65" fill="#69e0cb" font-size="30" font-weight="700" text-anchor="start">WHAT SHOULD HAPPEN NEXT?</text><rect x="40" y="105" width="760" height="125" rx="18" fill="#1c3348" stroke="#a5c9ff" stroke-width="2"/><text x="420" y="155" fill="#f1f6ff" font-size="30" font-weight="700" text-anchor="middle">Compare the source records.</text><text x="420" y="196" fill="#bbcade" font-size="23" font-weight="400" text-anchor="middle">Do they establish the same event and approval?</text><path d="M65 230 V758" fill="none" stroke="#69e0cb" stroke-width="3"/><path d="M65 367 L94 367" fill="none" stroke="#69e0cb" stroke-width="4" marker-end="url(#arrow)"/><rect x="100" y="285" width="700" height="165" rx="18" fill="#14243b" stroke="#69e0cb" stroke-width="2"/><text x="125" y="333" fill="#69e0cb" font-size="27" font-weight="700" text-anchor="start">MATCH + APPROVAL</text><text x="125" y="375" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">Record the comparison and close with No</text><text x="125" y="409" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">deviation found.</text><path d="M65 562 L94 562" fill="none" stroke="#69e0cb" stroke-width="4" marker-end="url(#arrow)"/><rect x="100" y="480" width="700" height="165" rx="18" fill="#14243b" stroke="#ffd397" stroke-width="2"/><text x="125" y="528" fill="#ffd397" font-size="27" font-weight="700" text-anchor="start">A RECORD IS MISSING</text><text x="125" y="570" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">Keep the uncertainty clear. Request the</text><text x="125" y="604" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">record; escalate if needed.</text><path d="M65 757 L94 757" fill="none" stroke="#69e0cb" stroke-width="4" marker-end="url(#arrow)"/><rect x="100" y="675" width="700" height="165" rx="18" fill="#14243b" stroke="#a5c9ff" stroke-width="2"/><text x="125" y="723" fill="#a5c9ff" font-size="27" font-weight="700" text-anchor="start">DETAILS DO NOT MATCH</text><text x="125" y="765" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">Write the exact difference. Ask the</text><text x="125" y="799" fill="#bbcade" font-size="24" font-weight="400" text-anchor="start">supervisor for clarification.</text><text x="40" y="915" fill="#f1f6ff" font-size="22" font-weight="600" text-anchor="start">These are alternative outcomes, not three required steps.</text><text x="40" y="952" fill="#bbcade" font-size="22" font-weight="400" text-anchor="start">A missing record does not establish wrongdoing or intent.</text></g></svg>