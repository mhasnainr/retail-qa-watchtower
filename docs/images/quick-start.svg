<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 690" role="img" aria-labelledby="title desc">
<title id="title">Three steps to open the project</title><desc id="desc">Download the ZIP, extract the whole folder, then open START_HERE.html for a clickable guide or index.html for the application. Do not open the files from inside the ZIP.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#69e0cb" stroke-width="1.6"/></marker></defs>
<rect width="840" height="690" rx="22" fill="#0b1425"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="65" fill="#69e0cb" font-size="30" font-weight="700" text-anchor="start">START WITHOUT CODING</text><rect x="40" y="105" width="760" height="140" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="64" y="149" fill="#f1f6ff" font-size="29" font-weight="700" text-anchor="start">1. DOWNLOAD</text><text x="64" y="187" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">On GitHub: Code → Download ZIP. Or use the ZIP</text><text x="64" y="218" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">provided with the project.</text><path d="M420 249 L420 267" fill="none" stroke="#69e0cb" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="273" width="760" height="140" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="64" y="317" fill="#f1f6ff" font-size="29" font-weight="700" text-anchor="start">2. EXTRACT</text><text x="64" y="355" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">Right-click the ZIP and choose Extract All. Open the</text><text x="64" y="386" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">extracted project folder.</text><path d="M420 417 L420 435" fill="none" stroke="#69e0cb" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="441" width="760" height="140" rx="18" fill="#14243b" stroke="#3a506e" stroke-width="2"/><text x="64" y="485" fill="#f1f6ff" font-size="29" font-weight="700" text-anchor="start">3. OPEN</text><text x="64" y="523" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">Double-click START_HERE.html for the guide, or</text><text x="64" y="554" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">index.html for the demo.</text><text x="40" y="650" fill="#bbcade" font-size="23" font-weight="400" text-anchor="start">Keep the extracted folder together. No signup is needed.</text></g></svg>